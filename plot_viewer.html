<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View & Download Saved Plots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .plot-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .plot-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        
        .plot-card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #f8f9fa;
            padding: 10px;
        }
        
        .plot-info {
            padding: 15px;
            border-top: 2px solid #e0e0e0;
        }
        
        .plot-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .plot-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
        }
        
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .action-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Saved Plot Viewer</h1>
        <p class="subtitle">View and download plots generated by the AI agent</p>
        
        <div class="input-group">
            <input type="text" id="fileIdInput" placeholder="Enter file_id (e.g., 78e34fd0-61ab-43bb-9508-d0979f979b55)" />
            <button onclick="loadPlots()">Load Plots</button>
        </div>
        
        <div id="message"></div>
        
        <div id="stats" style="display: none;">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="plotCount">0</div>
                    <div class="stat-label">Total Plots</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="datasetName">-</div>
                    <div class="stat-label">Dataset</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button onclick="downloadAllPlots()">📥 Download All as ZIP</button>
                <button onclick="deleteAllPlots()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🗑️ Delete All Plots</button>
            </div>
        </div>
        
        <div id="loading" style="display: none;" class="loading">
            <div class="spinner"></div>
            <p>Loading plots...</p>
        </div>
        
        <div id="plotsContainer" class="plots-grid"></div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentFileId = null;
        
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }
        
        async function loadPlots() {
            const fileId = document.getElementById('fileIdInput').value.trim();
            
            if (!fileId) {
                showMessage('Please enter a file_id', 'error');
                return;
            }
            
            currentFileId = fileId;
            const loadingDiv = document.getElementById('loading');
            const plotsContainer = document.getElementById('plotsContainer');
            const statsDiv = document.getElementById('stats');
            
            loadingDiv.style.display = 'block';
            plotsContainer.innerHTML = '';
            statsDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/plots/${fileId}`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to load plots');
                }
                
                const data = await response.json();
                loadingDiv.style.display = 'none';
                
                if (data.count === 0) {
                    showMessage('No plots found for this dataset. Try generating some plots first!', 'info');
                    return;
                }
                
                // Update stats
                document.getElementById('plotCount').textContent = data.count;
                document.getElementById('datasetName').textContent = data.dataset_name || fileId.substring(0, 8) + '...';
                statsDiv.style.display = 'block';
                
                // Display plots
                data.plots.forEach((plot, index) => {
                    const card = document.createElement('div');
                    card.className = 'plot-card';
                    
                    const timestamp = plot.timestamp ? new Date(plot.timestamp).toLocaleString() : 'Unknown';
                    
                    card.innerHTML = `
                        <img src="data:image/png;base64,${plot.plot_base64}" alt="${plot.plot_name}" />
                        <div class="plot-info">
                            <div class="plot-name">${plot.plot_name}</div>
                            <div class="plot-meta">
                                <span>${plot.plot_type}</span>
                                <span>${timestamp}</span>
                            </div>
                        </div>
                    `;
                    
                    plotsContainer.appendChild(card);
                });
                
                showMessage(`✅ Loaded ${data.count} plots successfully!`, 'success');
                
            } catch (error) {
                loadingDiv.style.display = 'none';
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function downloadAllPlots() {
            if (!currentFileId) {
                showMessage('Please load plots first', 'error');
                return;
            }
            
            try {
                showMessage('📦 Creating ZIP file...', 'info');
                
                const response = await fetch(`${API_BASE}/plots/${currentFileId}/download`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to download plots');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `plots_${currentFileId.substring(0, 8)}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showMessage('✅ Downloaded successfully!', 'success');
                
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function deleteAllPlots() {
            if (!currentFileId) {
                showMessage('Please load plots first', 'error');
                return;
            }
            
            if (!confirm('Are you sure you want to delete all plots for this dataset? This cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/plots/${currentFileId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete plots');
                }
                
                const data = await response.json();
                showMessage(`✅ Deleted ${data.deleted_count} plots successfully!`, 'success');
                
                // Reload to show empty state
                document.getElementById('plotsContainer').innerHTML = '';
                document.getElementById('stats').style.display = 'none';
                
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        // Allow Enter key to load plots
        document.getElementById('fileIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadPlots();
            }
        });
        
        // Auto-fill file_id from URL parameter if present
        const urlParams = new URLSearchParams(window.location.search);
        const fileIdParam = urlParams.get('file_id');
        if (fileIdParam) {
            document.getElementById('fileIdInput').value = fileIdParam;
            loadPlots();
        }
    </script>
</body>
</html>
